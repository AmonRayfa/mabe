name: CI/CD

on:
  push:
    branches: [dev, v1]
    tags: [v*-*.*]
  pull_request:
    branches: [dev, v1]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (build and test)
          - target: aarch64-unknown-linux-gnu
            test: true
          - target: armv7-unknown-linux-gnueabi
            test: true
          - target: armv7-unknown-linux-gnueabihf
            test: true
          - target: arm-unknown-linux-gnueabi
            test: true
          - target: arm-unknown-linux-gnueabihf
            test: true
          - target: i586-unknown-linux-gnu
            test: true
          - target: i686-unknown-linux-gnu
            test: true
          - target: x86_64-unknown-linux-gnu
            test: true

          # Android (build-only targets)
          - target: aarch64-linux-android
            test: false
          - target: armv7-linux-androideabi
            test: true
          - target: arm-linux-androideabi
            test: true
          - target: i686-linux-android
            test: false
          - target: x86_64-linux-android
            test: false

          # Windows (skips tests to avoid Wine issues)
          - target: i686-pc-windows-gnu
            test: false
          - target: x86_64-pc-windows-gnu
            test: false

          # Wasm
          - target: wasm32-unknown-emscripten
            test: false

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Build
        run: cross build --target ${{ matrix.target }} --all-features --verbose

      - name: Run tests
        if: matrix.test == true
        run: cross test --target ${{ matrix.target }} --all-features --verbose

  cd:
    needs: [ci]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Explicit write permission for releases.

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_VERSION="${GITHUB_REF#refs/tags/}"
          if [ -f "CHANGELOG.md" ]; then
             RELEASE_NOTES=$(awk '/^## /{i++}i==1{print; while(getline && !/^## /) print; exit}' CHANGELOG.md | tail -n +2)
          else
             RELEASE_NOTES="No changelog found."
          fi
          gh release create "$RELEASE_VERSION" --title "$RELEASE_VERSION" --notes "$RELEASE_NOTES"
